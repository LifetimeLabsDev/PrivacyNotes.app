# Zapstore listing for the direct-channel Android APK.
#
# The published artifact is the GitHub release asset, which is byte-identical to
# what releases.privacynotes.app serves. It is signed with the direct-channel
# certificate that packages/desktop/scripts/publish-android-release.sh pins and
# re-verifies on every publish. Zapstore records that certificate on the first
# publish and blocks any later release that does not match it, so the pin and
# the store agree by construction.
#
# Spec: ops/docs/android-setup.md (Zapstore listing)

repository: https://github.com/LifetimeLabsDev/PrivacyNotes.app

# Auto-whitelisting: Zapstore checks this key against the repository owner.
pubkey: npub1dhzrs20zh3eehq96fe8ewgatfr8u4gjzdh97z6p8n5qurkwqt7wsl7z3k9

# A release also carries a dmg, two AppImages, two debs, an installer exe and
# five checksum files. The APK is the only asset with a hyphen before the
# version, so anchor on that rather than on the extension alone.
match: '^PrivacyNotes-[0-9.]+\.apk$'

name: PrivacyNotes
summary: Notes. Tasks. Files. Vault. Zero knowledge.

# The copy below is the homepage, not a second version of it. Every line has a
# source in packages/web/src/locales/en/landing.json: the opening is hero.subhead,
# the list is the pillar blurbs, the source line is trust.openSourceBody and the
# closing line is hero.microcopy. Take a change from there rather than editing it
# here, so the store and the site cannot drift into two different pitches.
#
# The homepage kicker counting the pillars is deliberately NOT here: it includes
# the on-disk Markdown folder, which runs in the desktop app and Chromium only,
# so the count is wrong on a phone.
#
# Every paragraph and every list item is ONE unwrapped line. This is a literal
# YAML block, so a newline inside a sentence survives into the store and breaks
# the line there, at whatever column the file happened to wrap. Bold markers are
# left out for the same reason: the renderer turns "- " into a list item and
# prints "**" as two asterisks, so emphasis reads as punctuation.
description: |
  One encrypted place for everything you'd never post. Encrypted on your device before it goes anywhere. We couldn't read it if we tried.

  - Notes: rich live editor, tags, instant search.
  - Tasks: every checkbox, one view.
  - Vault: passwords, cards, SSH keys.
  - Journal: mood, sleep, medication. Research-backed tags, doctor export.
  - Files: encrypted images, docs, audio, and video.
  - Bookmark Sync: saved links with website icons. Import your browser bookmarks.

  The app and the encryption inside it are published, so anyone can check our zero-knowledge claims.

  Free forever. No credit card. Sign in with Google, Apple, or just a 12-word phrase.

# Tags drive where the store files this app, and the vocabulary is whatever
# publishers already use rather than a fixed list, so these are chosen to match
# the words in circulation instead of the ones that read best. Measured across
# published listings: "note" outnumbers "notes", "task" is in use, and
# "productivity" appears on nothing at all, which would have filed this app on
# its own. Check the neighbours before adding a word here.
tags:
  - note
  - task
  - privacy
  - encryption

license: AGPL-3.0
website: https://privacynotes.app
# The social profile avatar, not the icon from the press kit. A store tile is
# full bleed and draws its own corners, so it wants the square opaque artwork
# rather than the mark floated on white with its own padding.
# Spec: ops/docs/design-decisions.md (social avatar)
icon: https://privacynotes.app/marketing/brand/privacynotes-avatar.png

# Phone screenshots, fetched over HTTP at publish time. They live in this
# repository (ops/mirror/store in the private tree) rather than on the web
# app's origin, so a megabyte of store artwork stays out of every app
# download. Order is the order Zapstore shows them in, strongest first.
images:
  - https://raw.githubusercontent.com/LifetimeLabsDev/PrivacyNotes.app/main/assets/store/01-editor.webp
  - https://raw.githubusercontent.com/LifetimeLabsDev/PrivacyNotes.app/main/assets/store/02-journal.webp
  - https://raw.githubusercontent.com/LifetimeLabsDev/PrivacyNotes.app/main/assets/store/03-vault.webp
  - https://raw.githubusercontent.com/LifetimeLabsDev/PrivacyNotes.app/main/assets/store/04-language.webp
  - https://raw.githubusercontent.com/LifetimeLabsDev/PrivacyNotes.app/main/assets/store/05-appearance.webp
