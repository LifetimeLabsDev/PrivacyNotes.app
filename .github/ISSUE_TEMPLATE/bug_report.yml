name: Bug report
description: Something is broken or not working as expected
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Quick heads up before you paste a screenshot: this is a notes app, so a screenshot
        usually has your notes in it. Crop or blur them. Never post your recovery phrase.

        If it also happens at [try.privacynotes.app](https://try.privacynotes.app), mention it.
        Then we can see it for ourselves, with none of your notes involved.

  - type: textarea
    attributes:
      label: What happened?
      description: What went wrong, and what did you expect instead?
    validations:
      required: true

  - type: textarea
    attributes:
      label: How do we make it happen?
      description: The steps you took, so we can see it too.
    validations:
      required: true

  # id: version lets the in-app "report a bug" link prefill this from VERSION, so the reporter
  # never types it and we never get a guess. No placeholder on purpose: a pre-filled example
  # version just teaches people to accept it without looking, and a confidently wrong version
  # is worse than a blank one. Optional for anyone arriving straight from GitHub.
  # Spec: ops/docs/gotchas.md (not every channel auto-updates).
  - type: input
    id: version
    attributes:
      label: Version
      description: >
        Settings, then About. Leave it blank if you are not sure: we would rather have no
        answer than a guess.
    validations:
      required: false

  - type: dropdown
    id: where
    attributes:
      label: Where?
      options:
        - In a browser
        - Mac app
        - Windows app
        - Linux app
        - iPhone or iPad app
        - Android app (downloaded from our site)
        - Android app (from Google Play)
    validations:
      required: true
